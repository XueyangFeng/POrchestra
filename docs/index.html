<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAIA2 trajectory browser</title><style>
:root{color-scheme:light dark;--bg:#f3f6fa;--fg:#202c40;--card:#fff;--muted:#536379;--line:#d5deea;--accent:#285ac7;--soft:#eaf0ff;--added:#146345;--removed:#9b3434}
@media(prefers-color-scheme:dark){:root{--bg:#111923;--fg:#e3eaf5;--card:#192433;--muted:#adbbcd;--line:#35465a;--accent:#a9c2ff;--soft:#24344d;--added:#93dcb9;--removed:#ffb0b0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:32px 24px 80px}h1{font-size:28px;line-height:1.3}h2{font-size:22px}h3{font-size:18px;margin:12px 0}a{color:var(--accent)}nav,.tags,.flow{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin:18px 0}.update{border-left:5px solid var(--accent)}.muted{color:var(--muted)}.badge{display:inline-block;background:var(--soft);padding:3px 10px;border-radius:5px;font-size:14px}.flow a{padding:8px 12px;background:var(--soft);border-radius:6px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.columns>div{min-width:0}.added{color:var(--added)}.removed{color:var(--removed)}pre{font:14px/1.6 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);padding:14px;border-radius:6px;margin:8px 0}details{margin:12px 0}summary{cursor:pointer;overflow-wrap:anywhere;padding:6px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:12px;overflow-wrap:anywhere}th{background:var(--soft)}p,li,code{overflow-wrap:anywhere}ul{padding-left:22px}input,select,button{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}label{display:inline-flex;gap:10px;align-items:center;flex-wrap:wrap}input[type=search]{width:min(500px,100%)}.step{color:var(--accent);font-size:14px;font-weight:600}.event{border-top:1px solid var(--line)}:target{scroll-margin-top:20px;outline:2px solid var(--accent);outline-offset:4px}[hidden]{display:none!important}@media(max-width:650px){main{padding:20px 12px 50px}.columns{grid-template-columns:1fr}.card{padding:15px}th,td{padding:8px}h1{font-size:24px}}
</style></head><body><main><h1>GAIA2 trajectory browser</h1><p><a href="trajectories/index.html">Browse PORCHESTRA harness configuration histories</a></p><p>384 trajectories across three rounds, including 113 recorded configuration updates.</p></main><script>
document.querySelectorAll('[data-event-filter]').forEach(c=>c.addEventListener('change',()=>{document.querySelectorAll('.ordinary-event').forEach(e=>e.hidden=c.checked)}));
const search=document.querySelector('#search'),only=document.querySelector('#only-revisions');
function filter(){let n=0;document.querySelectorAll('tr[data-query]').forEach(r=>{let show=(!search||r.dataset.query.includes(search.value.toLowerCase()))&&(!only||!only.checked||Number(r.dataset.updates)>0);r.hidden=!show;if(show)n++});let count=document.querySelector('#count');if(count)count.textContent=n+' trajectories'}
if(search)search.addEventListener('input',filter);if(only)only.addEventListener('change',filter);if(search)filter();
</script></body></html>
