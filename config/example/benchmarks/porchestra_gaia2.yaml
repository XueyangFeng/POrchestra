# Install ARE in workspace/are-env and download the dataset separately.
are_root: ../../workspace/are
are_benchmark_bin: ../../workspace/are-env/bin/are-benchmark
dataset: ../../workspace/datasets/gaia2-mini
dataset_config: mini
split: null
limit: 1
agent: porchestra
provider: llama-api
model: gpt-4o
endpoint: https://api.openai.com/v1
sub_provider: llama-api
sub_model: gpt-4o
sub_endpoint: https://api.openai.com/v1
judge_provider: llama-api
judge_model: gpt-4o
judge_endpoint: https://api.openai.com/v1
api_key_env: OPENAI_API_KEY
max_concurrent_scenarios: 1
executor_type: thread
num_runs: 1
max_iterations: 300
subagent_max_steps: 30
max_attempts: 10
scenario_timeout: 14400
trace_dump_format: lite
log_level: INFO
enable_caching: false
fail_on_context_overflow: true
use_cli_judge_prompts: false
runtime_root: ../../workspace/runtime
result_folder: ../../workspace/logs/gaia2
run_name: porchestra_gaia2
